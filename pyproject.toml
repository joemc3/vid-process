[project]
name = "vidproc"
version = "0.1.0"
description = "Poster Theater session trim pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "httpx>=0.27"]

[project.scripts]
vidproc = "vidproc.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidproc"]

[tool.ruff]
# video_monitor.py is the legacy file-copy monitor. It predates this project's
# lint config and documents Python 3.6+ compatibility, which auto-fixes would
# break by modernising its type hints. Excluded until it is migrated.
extend-exclude = ["video_monitor.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["samples: requires real footage under sample/ (deselect with -m 'not samples')"]
